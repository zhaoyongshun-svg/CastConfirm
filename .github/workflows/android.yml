name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip
        run: unzip -o CastConfirm-dlna-mvp.zip

      - name: Fetch cling+seamless from archive.org
        run: |
          mkdir -p localrepo/org/fourthline/cling/cling/2.1.1 \
                   localrepo/org/fourthline/cling/cling-core/2.1.1 \
                   localrepo/org/fourthline/cling/cling-support/2.1.1 \
                   localrepo/org/seamless/parent/1.1.1 \
                   localrepo/org/seamless/seamless-util/1.1.1 \
                   localrepo/org/seamless/seamless-http/1.1.1 \
                   localrepo/org/seamless/seamless-xml/1.1.1 \
                   localrepo/org/seamless/seamless-swing/1.1.1
          fetch() {
            path="$1"; out="$2"
            for ts in 2022 2021 2020 2019 2018 2017 2016 2015; do
              if curl -fsSL --retry 2 -o "$out" "https://web.archive.org/web/${ts}id_/https://4thline.org/m2/${path}"; then
                echo "OK  $path"; return 0
              fi
            done
            echo "FAILED $path"; return 1
          }
          failed=0
          fetch org/fourthline/cling/cling/2.1.1/cling-2.1.1.pom localrepo/org/fourthline/cling/cling/2.1.1/cling-2.1.1.pom || failed=1
          fetch org/fourthline/cling/cling-core/2.1.1/cling-core-2.1.1.jar localrepo/org/fourthline/cling/cling-core/2.1.1/cling-core-2.1.1.jar || failed=1
          fetch org/fourthline/cling/cling-core/2.1.1/cling-core-2.1.1.pom localrepo/org/fourthline/cling/cling-core/2.1.1/cling-core-2.1.1.pom || failed=1
          fetch org/fourthline/cling/cling-support/2.1.1/cling-support-2.1.1.jar localrepo/org/fourthline/cling/cling-support/2.1.1/cling-support-2.1.1.jar || failed=1
          fetch org/fourthline/cling/cling-support/2.1.1/cling-support-2.1.1.pom localrepo/org/fourthline/cling/cling-support/2.1.1/cling-support-2.1.1.pom || failed=1
          fetch org/seamless/parent/1.1.1/parent-1.1.1.pom localrepo/org/seamless/parent/1.1.1/parent-1.1.1.pom || failed=1
          fetch org/seamless/seamless-util/1.1.1/seamless-util-1.1.1.jar localrepo/org/seamless/seamless-util/1.1.1/seamless-util-1.1.1.jar || failed=1
          fetch org/seamless/seamless-util/1.1.1/seamless-util-1.1.1.pom localrepo/org/seamless/seamless-util/1.1.1/seamless-util-1.1.1.pom || failed=1
          fetch org/seamless/seamless-http/1.1.1/seamless-http-1.1.1.jar localrepo/org/seamless/seamless-http/1.1.1/seamless-http-1.1.1.jar || failed=1
          fetch org/seamless/seamless-http/1.1.1/seamless-http-1.1.1.pom localrepo/org/seamless/seamless-http/1.1.1/seamless-http-1.1.1.pom || failed=1
          fetch org/seamless/seamless-xml/1.1.1/seamless-xml-1.1.1.jar localrepo/org/seamless/seamless-xml/1.1.1/seamless-xml-1.1.1.jar || failed=1
          fetch org/seamless/seamless-xml/1.1.1/seamless-xml-1.1.1.pom localrepo/org/seamless/seamless-xml/1.1.1/seamless-xml-1.1.1.pom || failed=1
          fetch org/seamless/seamless-swing/1.1.1/seamless-swing-1.1.1.jar localrepo/org/seamless/seamless-swing/1.1.1/seamless-swing-1.1.1.jar || failed=1
          fetch org/seamless/seamless-swing/1.1.1/seamless-swing-1.1.1.pom localrepo/org/seamless/seamless-swing/1.1.1/seamless-swing-1.1.1.pom || failed=1
          if [ "$failed" = "1" ]; then echo "some files failed"; exit 1; fi

      - name: Fix settings.gradle
        run: |
          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            'dependencyResolutionManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        maven { url uri("$rootDir/../localrepo") }' \
            '    }' \
            '}' \
            "rootProject.name = 'CastConfirm'" \
            "include ':app'" \
            > CastConfirm/settings.gradle

      - name: Fix gradle.properties
        run: |
          printf 'android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx2048m\n' > CastConfirm/gradle.properties

      - name: Build
        run: |
          cd CastConfirm
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: castconfirm-debug-apk
          path: CastConfirm/app/build/outputs/apk/debug/app-debug.apk
