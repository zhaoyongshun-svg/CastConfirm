name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip
        run: unzip -o CastConfirm-dlna-mvp.zip

      # 新增这一段 ↓
      - name: Fix gradle.properties
        run: |
          printf 'android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx2048m\n' > CastConfirm/gradle.properties

      - name: Build
        run: |
          cd CastConfirm
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: castconfirm-debug-apk
          path: CastConfirm/app/build/outputs/apk/debug/app-debug.apk
